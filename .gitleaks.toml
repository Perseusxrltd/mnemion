title = "Mnemion secret scan"

[extend]
useDefault = true

[[rules]]
id = "mnemion-vault-key"
description = "Mnemion vault host or portable-export recovery key"
regex = '''\bmnv_[A-Za-z0-9_-]{43}\b'''
keywords = ["mnv_"]

[[rules]]
id = "mnemion-application-or-backup-key"
description = "Mnemion application access or backup encryption key"
regex = '''\bmnm_(?:bk_)?[A-Za-z0-9_-]{43}\b'''
keywords = ["mnm_"]

[[allowlists]]
description = "Reviewed public evidence/model SHA-256 digests and a documented request idempotency key; these confer no access."
regexTarget = "secret"
regexes = [
  '''^224d882476a0a1847275c9152a4152ed5abe79468dffcde146e485cccc91b1ee$''',
  '''^0b0044b47eedf19b7f47339c6748131a744800df8f5b4873c0fcbf89728dba39$''',
  '''^d648d19ee54a17647cee83a81f06d7f6ad2d117b1802b80ac353f2588facf087$''',
  '''^0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39$''',
  '''^d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66$''',
  '''^billing-policy-2026-10-09$''',
]

[[allowlists]]
description = "Reviewed bounded JSON reader call: the matched text is an integer byte limit, not a credential."
regexTarget = "line"
regexes = [
  '''^\s*_read_json\(selected\.cred[e]ntials, max_bytes=16 \* 1024 \* 1024\),\s*$''',
]

[[allowlists]]
description = "Reviewed cryptography 50.0.2 HPKE stub annotation; only this complete type-only line is allowed."
regexTarget = "line"
regexes = [
  '''^\s*private_key: x25519\.X25519PrivateKey\s*$''',
]

[[allowlists]]
description = "Reviewed signed service-update migration SHA-256 digests for 013, 016 and 020; verified against the immutable migration files."
regexTarget = "secret"
regexes = [
  '''^9539cddc5ffa9587f192aed9fbe94dd1e92a26ac70233511dbaf86210cee2116$''',
  '''^6ee51bb6929743f5cdc5541a935085f82ec6d95a818db36bbb295a3dd016ae43$''',
  '''^71455047ab91b44618a2e0f9a36281fd674df1c8c462f200a058cf267b362963$''',
]

[[allowlists]]
description = "OpenSSL's published default FIPS module-integrity key and its exact observed 38-hex scanner fragment, derived from its documented public phrase; these are not application credentials."
regexTarget = "secret"
regexes = [
  '''^f4556650ac31d35461610bac4ed81b1a181b2d8a43ea2854cbae22ca74560813$''',
  '''^f4556650ac31d35461610bac4ed81b1a181b2d$''',
]

[[allowlists]]
description = "Reviewed exact truncated Base64 fragment of Electron 44.9.3 WebAssembly data, verified against the official upstream resource; no complete files or other tokens are excluded."
regexTarget = "secret"
regexes = [
  '''^EAAAWhAAAJkQAACeEAAAnxAAAKoYAACqGAAAgBsAAKobAACu$''',
]

[[allowlists]]
description = "Reviewed exact truncated Sparkle 2.10.0 public header path from its signed resource manifest; verified against the pinned upstream distribution. No complete files or other tokens are excluded."
regexTarget = "secret"
regexes = [
  '''^PrivateHeaders/SPUAppcast$''',
]
