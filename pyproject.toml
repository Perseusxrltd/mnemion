[project]
name = "mnemion"
version = "4.39.0"
description = "Shared memory infrastructure for applications, teams, and AI assistants, with source evidence and Obsidian visualization."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [
    {name = "Perseus XR"},
]
maintainers = [
    {name = "PERSEUS LEGACY LIMITED"},
]
keywords = [
    "ai", "memory", "llm", "rag", "chromadb", "mcp",
    "vector-database", "claude", "chatgpt", "embeddings",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.143.0,<0.144",
    "uvicorn>=0.54.0,<1",
    "psycopg[binary,pool]>=3.3.6,<4",
    "pgvector>=0.5.1,<0.6",
    "fastembed==0.9.0",
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.14'",
    "onnxruntime==1.31.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "mcp>=2.3.0,<3",
    "cryptography==50.0.2",
    "PyJWT[crypto]==2.15.1",
    "zxcvbn==4.5.0",
    "httpx>=0.28.1,<0.29",
    "jsonschema>=4.26.0,<5",
    "pyyaml>=6.0.3,<7",
    "tomlkit>=0.13.3,<1",
    "ruamel.yaml==0.19.1",
    "json5==0.17.3",
    "psutil>=7.2.2,<8",
    "ngrok==1.7.0",
    "argon2-cffi==25.1.0",
    # 26.1 removed Intel Mac wheels; both bindings vendor the same Argon2 source.
    # Managed hosts install verified binaries without a local compiler.
    "argon2-cffi-bindings==25.1.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "argon2-cffi-bindings==26.1.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pycryptodomex==3.24.1",
    "defusedxml==0.7.1",
]

[project.urls]
Homepage = "https://github.com/Perseusxrltd/mnemion"
Repository = "https://github.com/Perseusxrltd/mnemion"
"Bug Tracker" = "https://github.com/Perseusxrltd/mnemion/issues"

[project.scripts]
mnemion = "mnemion.cli:main"
mnemion-service = "mnemion.service.cli:main"
mnemion-connect = "mnemion.connectors.runner:main"
mnemion-agent = "mnemion.agent_setup:main"
mnemion-control = "mnemion.control_cli:main"
mnemion-capture-hook = "mnemion.capture.shared:main"

[project.entry-points."mnemion.backends"]
chroma = "mnemion.backends.chroma:ChromaBackend"

[project.entry-points."mnemion.sources"]

[project.optional-dependencies]
supervision = ["supervisor==4.3.0; platform_system != 'Windows'"]
legacy = [
    "chromadb>=0.6.3,<0.7",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40.0,<2.0",
    "protobuf>=6.31.1,<7.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "psutil>=5.9",
    "pgserver>=0.1.4; platform_system != 'Windows' and python_version == '3.12'",
]
spellcheck = ["autocorrect>=2.0"]
lewm = ["torch>=2.0", "numpy>=1.24"]
studio = ["uvicorn[standard]>=0.54.0", "pyinstaller>=6.0"]
gpu = ["onnxruntime-gpu>=1.20.1; platform_system != 'Darwin'"]
dml = ["onnxruntime-directml>=1.20.1; platform_system == 'Windows'"]
coreml = ["onnxruntime>=1.20.1; python_version >= '3.10' and platform_system == 'Darwin'"]

[dependency-groups]
native-build = ["pyinstaller==6.22.3"]
dev = [
    "supervisor==4.3.0; platform_system != 'Windows'",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "psutil>=5.9",
    "pgserver>=0.1.4; platform_system != 'Windows' and python_version == '3.12'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemion"]

[tool.hatch.build]
artifacts = ["mnemion/_studio/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["*.py", "*.pyi", "*.ipynb"]
extend-exclude = ["docs/research", "output"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests", "service_tests", "client_tests"]
pythonpath = ["."]
addopts = "-m 'not benchmark and not slow and not stress'"
markers = [
    "benchmark: scale/performance benchmark tests",
    "slow: tests that take more than 30 seconds",
    "stress: destructive scale tests (100K+ drawers)",
]

[tool.coverage.run]
source = ["mnemion"]

[tool.coverage.report]
fail_under = 30
show_missing = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
