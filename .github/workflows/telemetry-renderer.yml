name: Telemetry renderer diagnostic
run-name: Telemetry renderer ${{ inputs.source }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact reviewed source commit (40 hex characters)
        required: true
        type: string
      attribution:
        description: Six fixed counterbalanced attribution journeys; never resource acceptance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telemetry-renderer-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  renderer:
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.attribution && 30 || 20 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            studio/frontend/package-lock.json
            studio/electron/package-lock.json
      - name: Record the reviewed source
        env:
          REVIEWED_SOURCE: ${{ inputs.source }}
          TELEMETRY_ATTRIBUTION: ${{ inputs.attribution }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          source = os.environ['REVIEWED_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}', source)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          Path('output/telemetry-renderer').mkdir(parents=True)
          Path('output/telemetry-renderer/source.json').write_text(json.dumps({
              'source': source, 'attribution': os.environ['TELEMETRY_ATTRIBUTION'] == 'true',
          }) + '\n')
          PY
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2 libnotify4 libsecret-1-0
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked --python 3.12 --group dev
      - run: npm --prefix packages/client ci
      - run: npm --prefix packages/client run build
      - run: npm --prefix studio/frontend ci
      - run: npm --prefix studio/electron ci
      - name: Install the pinned Electron executable
        run: node studio/electron/node_modules/electron/install.js
      - name: Build the real desktop bridge
        env:
          MNEMION_BUILD_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npm --prefix studio/electron run build
      - name: Install the pinned diagnostic controller
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/telemetry-controller" --no-audit --no-fund --ignore-scripts playwright@1.64.0-alpha-1790635538000
      - name: Measure the declared compiled app journeys
        env:
          TELEMETRY_ATTRIBUTION: ${{ inputs.attribution }}
        run: |
          args=()
          if [ "$TELEMETRY_ATTRIBUTION" = "true" ]; then args+=(--attribution); fi
          xvfb-run -a uv run --no-sync python -m deploy.probe_telemetry_renderer \
            --source "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/output/telemetry-renderer/workload" \
            --playwright-module "$RUNNER_TEMP/telemetry-controller/node_modules/playwright/index.mjs" "${args[@]}"
      - name: Summarize retained measurements
        run: uv run --no-sync python -m deploy.report_telemetry_renderer output/telemetry-renderer/workload --output output/telemetry-renderer/summary.json
      - name: Preserve original observations and cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-renderer-linux-x64
          path: output/telemetry-renderer/
          if-no-files-found: error
          retention-days: 7
