name: Telemetry renderer diagnostic
run-name: Telemetry ${{ inputs.review_journey && 'review' || 'renderer' }} ${{ inputs.source }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact reviewed source commit (40 hex characters)
        required: true
        type: string
      attribution:
        description: Six fixed counterbalanced attribution journeys; never resource acceptance
        type: boolean
        default: false
      comparison:
        description: Six fixed counterbalanced app journeys without allocation attribution
        type: boolean
        default: false
      phase_memory:
        description: With comparison only, record fixed main-process residency and V8 counters; never resource acceptance
        type: boolean
        default: false
      review_journey:
        description: Real manual review, approval, opt-out and restart; separate from resource measurement
        type: boolean
        default: false

permissions:
  contents: read

# Linux compiled-source x64 only. A comparison or attribution dispatch runs the
# journey as one transient service: Delegate=yes, the runner User and Group,
# the workspace, and a tool/home environment. A root scope is not used. This
# is not installed or all-OS acceptance.

concurrency:
  group: telemetry-renderer-${{ inputs.source }}${{ inputs.review_journey && '-review' || '' }}
  cancel-in-progress: false

jobs:
  renderer:
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ (inputs.attribution || inputs.comparison) && 30 || 20 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            studio/frontend/package-lock.json
            studio/electron/package-lock.json
      - name: Record the reviewed source
        env:
          REVIEWED_SOURCE: ${{ inputs.source }}
          TELEMETRY_ATTRIBUTION: ${{ inputs.attribution }}
          TELEMETRY_COMPARISON: ${{ inputs.comparison }}
          TELEMETRY_PHASE_MEMORY: ${{ inputs.phase_memory }}
          TELEMETRY_REVIEW_JOURNEY: ${{ inputs.review_journey }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          source = os.environ['REVIEWED_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}', source)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          attribution = os.environ['TELEMETRY_ATTRIBUTION'] == 'true'
          comparison = os.environ['TELEMETRY_COMPARISON'] == 'true'
          phase_memory = os.environ['TELEMETRY_PHASE_MEMORY'] == 'true'
          review = os.environ['TELEMETRY_REVIEW_JOURNEY'] == 'true'
          assert sum((attribution, comparison, review)) <= 1, 'Choose comparison, attribution or report review'
          assert not phase_memory or (comparison and not attribution and not review), (
              'Phase-memory counters require comparison without attribution'
          )
          Path('output/telemetry-renderer').mkdir(parents=True)
          metadata = {'source': source, 'attribution': attribution}
          if comparison:
              metadata['comparison'] = True
          if phase_memory:
              metadata['phase_memory'] = True
              metadata['resource_acceptance'] = False
          if review:
              metadata['review_journey'] = True
          Path('output/telemetry-renderer/source.json').write_text(json.dumps(metadata) + '\n')
          PY
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2 libnotify4 libsecret-1-0
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked --python 3.12 --group dev
      - run: npm --prefix packages/client ci
      - run: npm --prefix packages/client run build
      - run: npm --prefix studio/frontend ci
      - run: npm --prefix studio/electron ci
      - name: Install the pinned Electron executable
        run: node studio/electron/node_modules/electron/install.js
      - name: Build the real desktop bridge
        env:
          MNEMION_BUILD_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npm --prefix studio/electron run build
      - name: Install the pinned diagnostic controller
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/telemetry-controller" --no-audit --no-fund --ignore-scripts playwright@1.64.0-alpha-1790635538000
      - name: Exercise the declared compiled app journeys
        env:
          TELEMETRY_ATTRIBUTION: ${{ inputs.attribution }}
          TELEMETRY_COMPARISON: ${{ inputs.comparison }}
          TELEMETRY_PHASE_MEMORY: ${{ inputs.phase_memory }}
          TELEMETRY_REVIEW_JOURNEY: ${{ inputs.review_journey }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          from deploy.report_telemetry_renderer import (
              owned_delegate_identity_ok,
              owned_scope_command,
          )

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          attribution = os.environ["TELEMETRY_ATTRIBUTION"] == "true"
          comparison = os.environ["TELEMETRY_COMPARISON"] == "true"
          phase_memory = os.environ["TELEMETRY_PHASE_MEMORY"] == "true"
          review = os.environ["TELEMETRY_REVIEW_JOURNEY"] == "true"
          requested = attribution or comparison
          output = workspace / "output/telemetry-renderer/workload"
          playwright = Path(os.environ["RUNNER_TEMP"]) / "telemetry-controller/node_modules/playwright/index.mjs"
          flags = []
          if attribution:
              flags.append("--attribution")
          if comparison:
              flags.append("--comparison")
          if phase_memory:
              flags.append("--phase-memory")
          if review:
              flags.append("--review-journey")
          command = [
              "xvfb-run", "-a", "uv", "run", "--no-sync", "python", "-m",
              "deploy.probe_telemetry_renderer",
              "--source", str(workspace),
              "--output", str(output),
              "--playwright-module", str(playwright),
              *flags,
          ]
          mode = "not_requested"
          if requested:
              python_bin = workspace / ".venv" / "bin" / "python"
              xvfb = shutil.which("xvfb-run")
              identity = shutil.which("id")
              if (
                  xvfb and Path(xvfb).is_absolute()
                  and python_bin.is_file()
                  and identity and Path(identity).is_absolute()
              ):
                  command = [
                      xvfb, "-a", str(python_bin), "-m", "deploy.probe_telemetry_renderer",
                      "--source", str(workspace),
                      "--output", str(output),
                      "--playwright-module", str(playwright),
                      *flags,
                  ]
              common = dict(
                  requested=True,
                  systemd=shutil.which("systemd-run"),
                  sudo=shutil.which("sudo"),
                  euid=os.geteuid(),
                  egid=os.getegid(),
                  cwd=str(workspace),
                  environ=dict(os.environ),
                  probe_accepted=None,
              )
              plain = list(command)
              command, mode = owned_scope_command(plain, **common)
              if mode == "systemd_service_delegate":
                  probe, probe_mode = owned_scope_command([identity, "-u"], **common)
                  accepted = False
                  if probe_mode == "systemd_service_delegate":
                      completed = subprocess.run(probe, capture_output=True, text=True)
                      accepted = owned_delegate_identity_ok(
                          completed.returncode, completed.stdout, common["euid"]
                      )
                  if not accepted:
                      command, mode = owned_scope_command(
                          plain, **{**common, "probe_accepted": False}
                      )
              record = workspace / "output/telemetry-renderer/owned-launch-scope.json"
              record.write_text(json.dumps({
                  "launch": mode,
                  "requested": True,
                  "resource_acceptance": False,
                  "installed_acceptance": False,
                  "scope": "linux-compiled-source-x64",
              }, sort_keys=True) + "\n", encoding="utf-8")
          raise SystemExit(subprocess.run(command).returncode)
          PY
      - name: Summarize retained measurements
        if: ${{ !inputs.review_journey }}
        run: uv run --no-sync python -m deploy.report_telemetry_renderer output/telemetry-renderer/workload --output output/telemetry-renderer/summary.json
      - name: Preserve original observations and cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-${{ inputs.review_journey && 'review' || 'renderer' }}-linux-x64
          path: output/telemetry-renderer/
          if-no-files-found: error
          retention-days: 7
