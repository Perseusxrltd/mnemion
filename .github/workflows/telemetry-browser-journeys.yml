name: Telemetry browser journeys
run-name: Telemetry browser journeys ${{ inputs.source }}

# Manual Linux diagnostic only. One Firefox journey and one WebKit journey.
# WebKit here is engine evidence, not native Safari acceptance. This does not
# publish, sign, or accept production collection or a resource budget.

on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact reviewed source commit (40 hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: telemetry-browser-journeys-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  browsers:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            studio/frontend/package-lock.json
      - name: Record the reviewed source
        env:
          REVIEWED_SOURCE: ${{ inputs.source }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          source = os.environ["REVIEWED_SOURCE"]
          assert re.fullmatch("[0-9a-f]{40}", source)
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
          Path("output/telemetry-browser-journeys").mkdir(parents=True)
          Path("output/telemetry-browser-journeys/dispatch.json").write_text(json.dumps({
              "source": source,
              "engines": ["firefox", "webkit"],
              "journey_attempts": 1,
              "resource_acceptance": False,
              "production_collection_available": False,
              "native_safari_acceptance": False,
          }) + "\n")
          PY
      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked --python 3.12 --group dev
      - run: npm --prefix packages/client ci
      - run: npm --prefix packages/client run build
      - run: npm --prefix studio/frontend ci
      - name: Install the pinned Firefox and WebKit driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/telemetry-browser" --no-audit --no-fund --ignore-scripts playwright@1.64.0-alpha-1790635538000
      - name: Install Firefox and WebKit
        run: node "$RUNNER_TEMP/telemetry-browser/node_modules/playwright/cli.js" install --with-deps firefox webkit
      - name: Exercise one journey in each engine
        run: |
          xvfb-run -a uv run --no-sync python -m deploy.probe_telemetry_browser \
            --source "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/output/telemetry-browser-journeys" \
            --playwright-module "$RUNNER_TEMP/telemetry-browser/node_modules/playwright/index.mjs"
      - name: Preserve journey observations and cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-browser-journeys-linux
          path: output/telemetry-browser-journeys/
          if-no-files-found: error
          retention-days: 7
