name: Native local database

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      matrix:
        description: Native database build targets selected by desktop packaging
        type: string
        default: '[{"os":"ubuntu-22.04","target":"linux","arch":"x64"},{"os":"ubuntu-22.04-arm","target":"linux","arch":"arm64"},{"os":"macos-26","target":"macos","arch":"arm64"},{"os":"macos-15-intel","target":"macos","arch":"x64"},{"os":"windows-2022","target":"windows","arch":"x64"}]'
# Desktop checks already call this matrix for every relevant push and PR.
# Keep direct dispatch for focused database verification without running a
# second identical compiler matrix on the same source event.

permissions:
  contents: read

concurrency:
  group: native-runtime-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_private_state:
    name: Private state / Windows / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Install small private-state test dependencies
        run: python -m pip install pytest pydantic
      - name: Check ownership, inherited privacy and restricted-token access
        run: python -m pytest client_tests/test_private_output.py client_tests/test_local_state.py client_tests/test_local_memory.py client_tests/test_archive_publication.py -q

  build:
    name: Database / ${{ matrix.target }} / ${{ matrix.arch }}
    needs: windows_private_state
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix || '[{"os":"ubuntu-22.04","target":"linux","arch":"x64"},{"os":"ubuntu-22.04-arm","target":"linux","arch":"arm64"},{"os":"macos-26","target":"macos","arch":"arm64"},{"os":"macos-15-intel","target":"macos","arch":"x64"},{"os":"windows-2022","target":"windows","arch":"x64"}]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fingerprint the database sources, compiler image and build instructions
        id: database-cache-key
        shell: bash
        run: python -m deploy.native_database_cache >> "$GITHUB_OUTPUT"
      - name: Restore an exact database build from the repository cache
        id: database-cache
        if: >-
          steps.database-cache-key.outputs.eligible == 'true' &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-tmp/native-postgres/*.zip
          key: ${{ steps.database-cache-key.outputs.key }}
      - name: Linux build tools
        if: runner.os == 'Linux' && steps.database-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex perl
      - name: Mac parser generators
        if: runner.os == 'macOS' && steps.database-cache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Windows compiler environment
        if: runner.os == 'Windows' && steps.database-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'A native MSVC compiler is required on the build runner.' }
          Import-Module "$installation/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCINSTALLDIR', 'VCToolsInstallDir', 'WindowsSdkDir', 'WindowsSDKVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" >> $env:GITHUB_ENV }
          }
          python -m pip install meson==1.12.1 ninja==1.13.2 pkgconf==3.0.7.post0
      - name: Compile pinned PostgreSQL, vector extension and static libraries
        if: steps.database-cache.outputs.cache-hit != 'true'
        run: python -m deploy.build_native_postgres --work "${{ runner.temp }}/native-postgres-work" --cache "${{ runner.temp }}/native-postgres-sources" --output build-tmp/native-postgres
      - name: Retain the compiled Windows archive for probe diagnosis
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-postgres-unprobed-windows-x64
          retention-days: 1
          if-no-files-found: error
          path: build-tmp/native-postgres/*.zip
      - name: Relocate, initialize, verify TLS and RLS, restore backup and recover a crash
        timeout-minutes: 10
        run: python -c "import json; from pathlib import Path; from deploy.probe_native_postgres import probe; archives=list(Path('build-tmp/native-postgres').glob('*.zip')); assert len(archives)==1; print(json.dumps(probe(archives[0], Path('build-tmp/native-postgres/probe.json'))))"
      - name: Cache the successfully probed database for later releases
        if: >-
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
          steps.database-cache-key.outputs.eligible == 'true' &&
          steps.database-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-tmp/native-postgres/*.zip
          key: ${{ steps.database-cache-key.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-postgres-${{ matrix.target }}-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error
          path: |
            build-tmp/native-postgres/*.zip
            build-tmp/native-postgres/probe.json

  windows_arm:
    name: Database / Windows ARM host / x64 engine
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (inputs.matrix == '' || contains(inputs.matrix, 'windows')) }}
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-postgres-windows-x64
          path: build-tmp/native-postgres
      - name: Verify the actual x64 engine under Windows ARM emulation
        timeout-minutes: 10
        run: python -c "import json; from pathlib import Path; from deploy.probe_native_postgres import probe; archives=list(Path('build-tmp/native-postgres').glob('*.zip')); assert len(archives)==1; result=probe(archives[0], Path('build-tmp/native-postgres/probe-arm.json')); assert result['emulated'] and result['host_architecture']=='arm64'; print(json.dumps(result))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-postgres-windows-arm-evidence
          retention-days: 1
          if-no-files-found: error
          path: build-tmp/native-postgres/probe-arm.json
