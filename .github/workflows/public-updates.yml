name: Public desktop update rehearsal

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Current public release to verify (latest or vX.Y.Z)
        default: latest
        type: string
      platform:
        description: Rehearse all platforms or one platform during investigation
        type: choice
        default: all
        options: [all, windows, macos, linux]

permissions:
  contents: read

concurrency:
  group: public-desktop-updates-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      available: ${{ steps.select.outputs.available }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          MNEMION_PROBE_TAG: ${{ inputs.tag || github.event.release.tag_name || 'latest' }}
          MNEMION_PROBE_SELECTION: ${{ inputs.platform || 'all' }}
        run: python -m deploy.public_update_probe --select --tag "$MNEMION_PROBE_TAG" --selection-platform "$MNEMION_PROBE_SELECTION" >> "$GITHUB_OUTPUT"
      - name: Record selection
        env:
          MNEMION_PROBE_MATRIX: ${{ steps.select.outputs.matrix }}
          MNEMION_PROBE_SKIPPED: ${{ steps.select.outputs.skipped }}
        run: python -c "import os; print(os.environ['MNEMION_PROBE_MATRIX']); print(os.environ['MNEMION_PROBE_SKIPPED'])"

  upgrade:
    needs: select
    if: needs.select.outputs.available == 'true'
    name: ${{ matrix.platform }} / ${{ matrix.arch }} public upgrade
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      MNEMION_PROBE_FROM: ${{ matrix.from }}
      MNEMION_PROBE_TO: ${{ matrix.to }}
      MNEMION_PROBE_PLATFORM: ${{ matrix.platform }}
      MNEMION_PROBE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - run: python -m pip install psutil==7.2.2
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libgtk-3-0 libnss3 libgbm1 libasound2 libnotify4 libfuse2
      - name: Install public release and observe its automatic update
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a python -m deploy.public_update_probe --from-tag "$MNEMION_PROBE_FROM" --to-tag "$MNEMION_PROBE_TO" --platform "$MNEMION_PROBE_PLATFORM" --arch "$MNEMION_PROBE_ARCH" --output "$RUNNER_TEMP/public-mnemion-upgrade"
          else
            python -m deploy.public_update_probe --from-tag "$MNEMION_PROBE_FROM" --to-tag "$MNEMION_PROBE_TO" --platform "$MNEMION_PROBE_PLATFORM" --arch "$MNEMION_PROBE_ARCH" --output "$RUNNER_TEMP/public-mnemion-upgrade"
          fi
      - name: Bounded result and diagnostics
        if: always()
        run: python -c "import os; from pathlib import Path; root=Path(os.environ['RUNNER_TEMP'])/'public-mnemion-upgrade'; [(print(name), print((root/name).read_text(errors='replace')[-32768:])) for name in ['result.json', 'application.log'] if (root/name).is_file()]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-update-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/public-mnemion-upgrade/result.json
            ${{ runner.temp }}/public-mnemion-upgrade/application.log
          if-no-files-found: ignore
          retention-days: 7
