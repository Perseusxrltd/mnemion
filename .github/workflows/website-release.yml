name: Synchronize public release metadata

on:
  release:
    types: [published, edited]
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release-metadata
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'Perseusxrltd/mnemion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Always update main, never the immutable release tag that raised the event.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify the latest published asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m deploy.published_release
      - name: Keep the CDN fallback current without triggering another build
        run: |
          git add -- deploy/published-release.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: synchronize published release metadata'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' rebase origin/main
          done
          exit 1
      - name: Verify live downloads, version, guides and roadmap
        run: python -m deploy.verify_website
      - name: Retain the public website verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-website-verification
          path: output/website-verification.json
          if-no-files-found: error
          retention-days: 30
