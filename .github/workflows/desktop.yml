name: Native desktop checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, arch: x64}
          - {os: ubuntu-22.04-arm, arch: arm64}
          - {os: windows-2022, arch: x64}
          - {os: windows-11-arm, arch: arm64}
          - {os: macos-15-intel, arch: x64}
          - {os: macos-15, arch: arm64}
    env:
      # Signing is available only to the explicit release workflow, never PR builds.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.release && 'true' || 'false' }}
      CSC_LINK: ${{ inputs.release && (matrix.os == 'windows-2022' || matrix.os == 'windows-11-arm') && secrets.WINDOWS_CSC_LINK || inputs.release && startsWith(matrix.os, 'macos-') && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ inputs.release && startsWith(matrix.os, 'windows-') && secrets.WINDOWS_CSC_KEY_PASSWORD || inputs.release && startsWith(matrix.os, 'macos-') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ inputs.release && startsWith(matrix.os, 'macos-') && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.release && startsWith(matrix.os, 'macos-') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ inputs.release && startsWith(matrix.os, 'macos-') && secrets.APPLE_TEAM_ID || '' }}
      MNEMION_REQUIRE_CODE_SIGNATURE: ${{ inputs.release && !startsWith(matrix.os, 'ubuntu-') && '1' || '0' }}
      MNEMION_BUILD_PYTHON: ${{ github.workspace }}/studio/client/.venv/${{ startsWith(matrix.os, 'windows-') && 'Scripts/python.exe' || 'bin/python' }}
    steps:
      - name: Require publisher credentials for a release
        if: inputs.release && runner.os != 'Linux'
        shell: bash
        run: |
          test -n "$CSC_LINK" || { echo "Configure publisher signing credentials before releasing automatic updates."; exit 1; }
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            studio/frontend/package-lock.json
            studio/electron/package-lock.json
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2 libnotify4 libfuse2
      - run: python -m pip install uv==0.12.24
      - run: uv sync --project studio/client --locked --python 3.13
      - run: uv run --project studio/client --no-sync python -m pytest client_tests -q
      - run: npm --prefix packages/client ci
      - run: npm --prefix packages/client test
      - run: npm --prefix studio/frontend ci
      - run: npm --prefix studio/electron ci
      - run: npm --prefix studio/electron test
      - run: npm --prefix studio/electron run dist
      - run: node studio/electron/scripts/test-local-client.mjs
      - name: Packaged window, sandboxed bridge, and local client
        if: runner.os != 'Linux'
        run: npm --prefix studio/electron run smoke:packaged
      - name: Packaged Linux window, sandboxed bridge, and local client
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix studio/electron run smoke:packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.release && 'release' || 'validation-only' }}-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist-electron/latest-*.yml
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.deb
            dist-electron/*.AppImage
            dist-electron/SHA256SUMS-*.txt
