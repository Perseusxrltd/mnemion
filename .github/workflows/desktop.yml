name: Native desktop checks

on:
  # Every release calls the full matrix. Avoid building the same six installers
  # once on a main push and again for its release; PR coverage stays unfiltered.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos_only:
        description: Validate the two Mac builds during updater development
        type: boolean
        default: false
      windows_only:
        description: Validate both native Windows builds during updater development
        type: boolean
        default: false
      architecture:
        description: Native processor architecture for a validation run
        type: choice
        options: [all, x64, arm64]
        default: all
      sign_macos:
        description: Verify the configured Mac signing key without uploading release artifacts
        type: boolean
        default: false
      sign_windows:
        description: Verify the Windows update signing key without uploading release artifacts
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      macos_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release || false }}-${{ inputs.architecture || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      database_matrix: ${{ steps.select.outputs.database_matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: select
        env:
          MNEMION_TARGET_ARCHITECTURE: ${{ inputs.architecture || 'all' }}
        run: python -m deploy.release_targets --architecture "$MNEMION_TARGET_ARCHITECTURE" ${{ inputs.release && '--release' || inputs.macos_only && '--macos-only' || inputs.windows_only && '--windows-only' || '' }} >> "$GITHUB_OUTPUT"
  native_database:
    needs: targets
    uses: ./.github/workflows/native-runtime.yml
    with:
      matrix: ${{ needs.targets.outputs.database_matrix }}
  windows_backup_metadata:
    needs: targets
    if: contains(needs.targets.outputs.matrix, 'windows-')
    name: Encrypted files / Windows / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          # Both Windows packages use the same x64 service engine, including
          # its filesystem and encryption runtime on the ARM host.
          architecture: x64
      - run: python -m pip install pytest cryptography==50.0.2
      - name: Verify native encrypted-file metadata before packaging
        run: python -m pytest native_tests/test_backup_file_metadata.py -q
  windows_engine:
    needs: [targets, windows_backup_metadata]
    if: contains(needs.targets.outputs.matrix, 'windows-')
    name: Service engine / Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install uv==0.12.24
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: uv sync --locked --no-default-groups --group native-build --python 3.13 --no-managed-python
      # Both Windows desktops use this exact backend. Freezing an emulated x64
      # interpreter on ARM can accidentally collect ARM system runtime DLLs.
      - run: uv run --no-sync python -m deploy.build_native_engine --work build-tmp/windows-engine-build --output build-tmp/windows-engine
      - name: Verify every collected executable and DLL before either desktop uses it
        run: uv run --no-sync python -c "from pathlib import Path; from deploy.native_resources import verify_component; verify_component(Path('build-tmp/windows-engine/mnemion-engine'), 'service', 'windows', 'x64')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-service-windows-x64
          path: build-tmp/windows-engine/*.zip
          if-no-files-found: error
          retention-days: 1
  desktop:
    needs: [targets, native_database, windows_engine, windows_backup_metadata]
    if: ${{ !cancelled() && needs.targets.result == 'success' && needs.native_database.result == 'success' && (needs.windows_engine.result == 'success' || needs.windows_engine.result == 'skipped') && (needs.windows_backup_metadata.result == 'success' || needs.windows_backup_metadata.result == 'skipped') }}
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      # Signing is available only to the explicit release workflow, never PR builds.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.release && startsWith(matrix.os, 'windows-') && 'true' || 'false' }}
      CSC_LINK: ${{ inputs.release && startsWith(matrix.os, 'windows-') && secrets.WINDOWS_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ inputs.release && startsWith(matrix.os, 'windows-') && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
      MNEMION_REQUIRE_CODE_SIGNATURE: ${{ inputs.release && startsWith(matrix.os, 'windows-') && secrets.WINDOWS_CSC_LINK != '' && '1' || '0' }}
      MNEMION_ENGINE_PYTHON: ${{ github.workspace }}/.venv/${{ startsWith(matrix.os, 'windows-') && 'Scripts/python.exe' || 'bin/python' }}
      MNEMION_BUILD_PYTHON: ${{ github.workspace }}/studio/client/.venv/${{ startsWith(matrix.os, 'windows-') && 'Scripts/python.exe' || 'bin/python' }}
      MNEMION_ENGINE_ARCHIVES: ${{ startsWith(matrix.os, 'windows-') && format('{0}/build-tmp/native-engine', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: client_python
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            studio/frontend/package-lock.json
            studio/electron/package-lock.json
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2 libnotify4 libfuse2 libsecret-1-0 gnome-keyring dbus-x11
      - run: python -m pip install uv==0.12.24
      - run: uv sync --project studio/client --locked --python "${{ steps.client_python.outputs.python-path }}" --no-managed-python
      - name: Select the service interpreter independently of the desktop client
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: engine_python
        with:
          python-version: '3.13'
          # The locked psycopg-binary has no Windows ARM wheel. The complete
          # backend uses explicit x64 compatibility on Windows ARM.
          architecture: ${{ matrix.platform == 'windows' && 'x64' || matrix.arch }}
      - name: Locked native service build dependencies
        run: uv sync --locked --no-default-groups --group native-build --python "${{ steps.engine_python.outputs.python-path }}" --no-managed-python
      - name: Verify Argon2id support in each native service build runtime
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import secrets
          from mnemion.service.passwords import hash_password, verify_password
          phrase = secrets.token_urlsafe(32)
          verifier = hash_password(phrase)
          assert verify_password(phrase, verifier)
          assert not verify_password(phrase + 'x', verifier)
          assert not verify_password(phrase, None)
          print('Bounded Argon2id verification passed in this build runtime')
          PY
      - name: Download this commit's verified database archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-postgres-${{ matrix.platform }}-${{ matrix.platform == 'windows' && 'x64' || matrix.arch }}
          path: build-tmp/native-postgres
      - name: Download this commit's verified x64 Windows service engine
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-service-windows-x64
          path: build-tmp/native-engine
      - run: uv run --project studio/client --no-sync python -m pytest client_tests -q
      - run: npm --prefix packages/client ci
      - run: npm --prefix packages/client test
      - run: npm --prefix studio/frontend ci
      - run: npm --prefix studio/electron ci
      - run: npm --prefix studio/electron test
      - name: Package the native desktop with one bounded upstream-download retry
        run: python -m deploy.build_desktop
      - name: Installed app creates, searches and reopens a real local workspace
        if: runner.os != 'Linux'
        run: npm --prefix studio/electron run smoke:installed-hosting
      - name: Installed Linux app creates, searches and reopens a real local workspace
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a bash deploy/native-keyring-test.sh installed-hosting
      - name: Sign and verify the free Windows update manifest
        if: (inputs.release || (github.event_name == 'workflow_dispatch' && inputs.sign_windows)) && runner.os == 'Windows'
        env:
          MNEMION_WINDOWS_UPDATE_PRIVATE_KEY: ${{ secrets.MNEMION_WINDOWS_UPDATE_PRIVATE_KEY }}
        run: node deploy/windows_updates.mjs sign
      - name: Sign and verify the free macOS update archive
        if: (inputs.release || (github.event_name == 'workflow_dispatch' && inputs.sign_macos)) && runner.os == 'macOS'
        env:
          MNEMION_MAC_UPDATE_PRIVATE_KEY: ${{ secrets.MNEMION_MAC_UPDATE_PRIVATE_KEY }}
        run: python -m deploy.macos_sparkle sign
      - run: node studio/electron/scripts/test-local-client.mjs
      - name: Packaged window, sandboxed bridge, and local client
        if: runner.os != 'Linux'
        run: npm --prefix studio/electron run smoke:packaged
      - name: Packaged Linux window, sandboxed bridge, and local client
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix studio/electron run smoke:packaged
      - name: Linux encrypted workspace reconnect after process restart
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a bash deploy/native-keyring-test.sh
      - name: Packaged Mac update, restart guards and relaunch
        if: runner.os == 'macOS'
        run: python -m deploy.macos_electron_update_probe --output "$RUNNER_TEMP/mnemion-electron-update"
      - name: Native Windows installation, authenticated upgrade and relaunch
        if: runner.os == 'Windows'
        shell: pwsh
        run: node studio/electron/scripts/windows-update-probe.mjs --output "$env:RUNNER_TEMP/mnemion-windows-update"
      - name: Bounded Windows update failure diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import os; from pathlib import Path; root=Path(os.environ['RUNNER_TEMP'])/'mnemion-windows-update'; [(print(name), print((root/name).read_text(errors='replace')[-8000:])) for name in ['build.log','electron.log','events.jsonl','spawn-error.txt','first-install.json','upgrade-failure.json','nsis-stages.log'] if (root/name).is_file()]"
      - name: Bounded native update failure diagnostics
        if: failure() && runner.os == 'macOS'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'mnemion-electron-update'
          for name in ['electron.log', 'events.jsonl']:
              path = root / name
              if path.is_file():
                  print(name)
                  print(path.read_text(errors='replace')[-8000:])
          PY
      - name: Keep the bounded installed hosting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-hosting-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: ignore
          path: build-tmp/installed-hosting-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Validation keeps its evidence in job logs, not large installer uploads.
        if: inputs.release
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist-electron/latest-*.yml
            dist-electron/latest-*-mac.xml
            dist-electron/latest-*-windows.json
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.deb
            dist-electron/*.AppImage
            dist-electron/SHA256SUMS-*.txt
