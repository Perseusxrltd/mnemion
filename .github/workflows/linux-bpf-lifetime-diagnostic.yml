name: Linux BPF lifetime diagnostic

# Manual compile-only dispatch. This does not adopt a backend, activate
# telemetry, or accept a resource budget. The Ubuntu label is not a kernel pin.
# The native collector is not qualified. It stays off unless run_native is
# explicitly true on a later dispatch. Build outputs are retained either way.

on:
  workflow_dispatch:
    inputs:
      run_native:
        description: Later explicit capability run. Stays false. Does not qualify the collector.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-bpf-lifetime-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the BPF build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm gcc libc6-dev make pkg-config libbpf-dev libelf-dev zlib1g-dev linux-libc-dev python3 python3-pytest
      - name: Build the CO-RE objects and loader
        run: make -C deploy/linux_bpf_lifetime
      - name: Run the offline parse and initialization checks
        run: python3 -m pytest tests/test_linux_bpf_lifetime_parse.py -q --noconftest
      - name: Run one admitted diagnostic
        if: ${{ inputs.run_native == true }}
        timeout-minutes: 5
        run: |
          sudo ./deploy/linux_bpf_lifetime/lifetime_diag --mode admit --receipt "$RUNNER_TEMP/lifetime-admit.bin"
          sudo ./deploy/linux_bpf_lifetime/lifetime_diag --mode direct --receipt "$RUNNER_TEMP/lifetime-direct.bin"
          python3 -c 'import pathlib,sys; sys.path.insert(0,"."); from deploy.linux_bpf_lifetime.receipt import validate_receipt; p=pathlib.Path(r"'"$RUNNER_TEMP"'/lifetime-direct.bin"); r=validate_receipt(p.read_bytes()); print(r); raise SystemExit(0 if r["ok"] else 1)'
      - name: Retain sanitized build outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-bpf-lifetime-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            deploy/linux_bpf_lifetime/lifetime_plain.bpf.o
            deploy/linux_bpf_lifetime/lifetime_bitfield.bpf.o
            deploy/linux_bpf_lifetime/lifetime_diag
            deploy/linux_bpf_lifetime/sha256_selftest
