name: Verify uploaded release artifacts
run-name: Verify release / ${{ github.event.workflow_run.head_sha || inputs.release_run }}

on:
  workflow_run:
    workflows: [Prepare signed release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run:
        description: Completed Prepare signed release run ID
        required: true
        type: string

# GitHub hides drafts from tokens without push access. The verification job is
# read-only; the separate dependent publication job has no signing credentials.
permissions:
  contents: write
  actions: read

concurrency:
  group: artifact-verification-${{ github.event.workflow_run.id || inputs.release_run }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: verifier
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install the release validator's pinned libraries
        run: python -m pip install PyYAML==6.0.3 cryptography==50.0.2
      - name: Resolve the completed repository release and all its gates
        id: source
        working-directory: verifier
        env:
          GH_TOKEN: ${{ github.token }}
          MNEMION_RELEASE_RUN: ${{ github.event.workflow_run.id || inputs.release_run }}
        run: >-
          python -m deploy.verify_artifacts --resolve --wait-seconds 1200
          --repo "$GITHUB_REPOSITORY" --run "$MNEMION_RELEASE_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: release-source
          persist-credentials: false
      - name: Verify every uploaded byte, production signature and complete feed
        working-directory: verifier
        env:
          GH_TOKEN: ${{ github.token }}
          MNEMION_RELEASE_RUN: ${{ github.event.workflow_run.id || inputs.release_run }}
        run: >-
          python -m deploy.verify_artifacts --wait-seconds 1200
          --repo "$GITHUB_REPOSITORY" --run "$MNEMION_RELEASE_RUN"
          --source "$GITHUB_WORKSPACE/release-source" --output "$RUNNER_TEMP/verified-release"
      - name: Scan the exact downloaded distributions before publication
        # The trusted verifier owns scan policy. Reviewed policy corrections do
        # not rebuild or alter the frozen source, signatures or uploaded bytes.
        working-directory: verifier
        run: >-
          python -m deploy.secret_scan
          --paths "$RUNNER_TEMP/verified-release/artifacts"
          --output "$RUNNER_TEMP/verified-release/secret-scan.json"
      - name: Retain the bounded verification receipt, without duplicate binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-artifacts
          path: |
            ${{ runner.temp }}/verified-release/release-verification.json
            ${{ runner.temp }}/verified-release/secret-scan.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded rejection evidence without credential matches
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rejected-release-verification
          path: |
            ${{ runner.temp }}/verified-release/release-verification.json
            ${{ runner.temp }}/verified-release/secret-scan.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: verify
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    concurrency:
      group: verified-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the pinned check-contract reader
        run: python -m pip install PyYAML==6.0.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-artifacts
          path: ${{ runner.temp }}/publication-receipt
      - name: Publish unchanged verified assets and dispatch public follow-ups
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m deploy.release_automation publish --repo "$GITHUB_REPOSITORY"
          --verification-run "$GITHUB_RUN_ID"
          --receipt "$RUNNER_TEMP/publication-receipt/release-verification.json"
      - name: Retain release evidence on main
        run: |
          git add -- docs/validation/releases
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: record verified release publication'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' rebase origin/main
          done
          exit 1
