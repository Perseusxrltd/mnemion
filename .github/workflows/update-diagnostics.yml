name: Linux updater developer diagnostic

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published source version to inspect (this is NOT an acceptance gate)
        type: string
        default: v4.0.9
      experiment:
        description: Inspect timers, launch behavior, or the visible-window focus guard
        type: choice
        default: inspect
        options: [inspect, timers, launch, focus]

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          MNEMION_DIAGNOSTIC_EXPERIMENT: ${{ inputs.experiment }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          modes = {
              'inspect': ['inspect'],
              'timers': ['original-timers', 'referenced-timers'],
              'launch': ['mounted-guards', 'extracted-guards'],
              'focus': ['mounted-guards', 'visible-focus'],
          }[os.environ['MNEMION_DIAGNOSTIC_EXPERIMENT']]
          rows = [{'os': system, 'arch': arch, 'mode': mode}
                  for system, arch in [('ubuntu-22.04', 'x64'), ('ubuntu-22.04-arm', 'arm64')]
                  for mode in modes]
          print('matrix=' + json.dumps(rows))
          PY
  diagnostic:
    needs: targets
    name: Linux ${{ matrix.arch }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      MNEMION_DIAGNOSTIC_TAG: ${{ inputs.tag }}
      MNEMION_DIAGNOSTIC_ARCH: ${{ matrix.arch }}
      MNEMION_DIAGNOSTIC_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install psutil==7.2.2
      - run: npm --prefix studio/electron ci --ignore-scripts
      - name: Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox x11-utils dbus-x11 libgtk-3-0 libnss3 libgbm1 libasound2 libnotify4 libfuse2 squashfs-tools
      - name: Inspect a separate instrumented copy
        run: |
          dbus-run-session -- xvfb-run -a bash -c '
            set -euo pipefail
            openbox --sm-disable >"$RUNNER_TEMP/window-manager.log" 2>&1 &
            mnemion_wm_pid=$!
            trap '\''kill "$mnemion_wm_pid" 2>/dev/null || true'\'' EXIT
            mnemion_wm_ready=false
            for mnemion_attempt in {1..100}; do
              mnemion_wm_property=$(xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null || true)
              if [[ "$mnemion_wm_property" == *"window id # 0x"* ]]; then
                mnemion_wm_ready=true; break
              fi
              sleep 0.2
            done
            test "$mnemion_wm_ready" = true
            python -m deploy.linux_update_diagnostic --tag "$MNEMION_DIAGNOSTIC_TAG" --arch "$MNEMION_DIAGNOSTIC_ARCH" --mode "$MNEMION_DIAGNOSTIC_MODE" --output "$RUNNER_TEMP/mnemion-update-diagnostic"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: developer-update-diagnostic-${{ matrix.arch }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/mnemion-update-diagnostic/diagnostic.json
            ${{ runner.temp }}/mnemion-update-diagnostic/snapshots.jsonl
            ${{ runner.temp }}/mnemion-update-diagnostic/timers.jsonl
            ${{ runner.temp }}/mnemion-update-diagnostic/application.log
          retention-days: 7
