name: Prepare signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse_checks: ${{ steps.reuse.outputs.reusable }}
      checks_run: ${{ steps.reuse.outputs.run_id }}
      runtime_artifact: ${{ steps.reuse.outputs.artifact_id }}
      runtime_digest: ${{ steps.reuse.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned preflight tools
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          packages = tomllib.loads(pathlib.Path('uv.lock').read_text())['package']
          version = next(package['version'] for package in packages if package['name'] == 'ruff')
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check', 'ruff==' + version, 'uv==0.12.24', 'PyYAML==6.0.3'], check=True)
          PY
      - run: ruff check .
      - run: ruff format --check .
      - run: python deploy/release.py
      - name: Check binary dependency availability before native builds
        run: python -m deploy.binary_preflight
      - run: git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n
      - name: Find complete checks for this exact release source
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m deploy.ci_reuse >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-check-reuse-selection
          path: output/ci-reuse.json
          retention-days: 14
          if-no-files-found: error
  checks:
    needs: preflight
    if: needs.preflight.outputs.reuse_checks != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release: true
  reused_checks:
    name: Reuse verified Product checks
    needs: preflight
    if: needs.preflight.outputs.reuse_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Restore the exact verified runtime artifact
        env:
          GH_TOKEN: ${{ github.token }}
          MNEMION_CI_ARTIFACT: ${{ needs.preflight.outputs.runtime_artifact }}
          MNEMION_CI_DIGEST: ${{ needs.preflight.outputs.runtime_digest }}
        run: python -m deploy.ci_reuse --restore-artifact-id "$MNEMION_CI_ARTIFACT" --artifact-digest "$MNEMION_CI_DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-service-macos-x64
          path: output/reused-runtime/*.whl
          retention-days: 1
          if-no-files-found: error
  native:
    needs: preflight
    uses: ./.github/workflows/desktop.yml
    with:
      release: true
    secrets: inherit
  assemble:
    needs: [preflight, checks, reused_checks, native]
    if: >-
      always() && !cancelled() && needs.preflight.result == 'success' && needs.native.result == 'success' &&
      ((needs.preflight.outputs.reuse_checks == 'false' && needs.checks.result == 'success' && needs.reused_checks.result == 'skipped') ||
       (needs.preflight.outputs.reuse_checks == 'true' && needs.reused_checks.result == 'success' && needs.checks.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install uv==0.12.24 PyYAML==6.0.3 cryptography==50.0.2
      - name: Build and bundle web Studio with its dependency notices
        run: python deploy/bundle_studio.py
      - name: Build Python packages without builder control files
        run: |
          uv build --out-dir build-tmp/source-release
          mkdir -p release-artifacts
          cp build-tmp/source-release/*.whl build-tmp/source-release/*.tar.gz release-artifacts/
      - run: cd packages/client && npm pack --pack-destination ../../release-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - name: Authenticate exact service packages, dependency lock and migrations
        env:
          MNEMION_SERVICE_UPDATE_PRIVATE_KEY: ${{ secrets.MNEMION_SERVICE_UPDATE_PRIVATE_KEY }}
        run: python -m deploy.service_update_manifest sign --artifacts release-artifacts --commit "$GITHUB_SHA"
      - name: Verify version and complete update feeds
        run: python deploy/release.py --artifacts release-artifacts
      - name: Prepare or refresh the reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python deploy/draft_release.py --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --artifacts release-artifacts
  cleanup:
    name: Remove temporary release transfers
    # Keep a failed assembly's transfers for a retry (one-day retention).
    # Successful assembly verifies the same bytes on the release draft.
    if: always() && needs.assemble.result == 'success'
    needs: [native, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete only this run's release staging artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("release-")) | .id' > "$RUNNER_TEMP/release-artifact-ids"
          while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done < "$RUNNER_TEMP/release-artifact-ids"
