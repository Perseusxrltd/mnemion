name: Reconcile public release status

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  release:
    types: [published, edited]
  workflow_run:
    workflows: [Product checks, Prepare signed release, Verify uploaded release artifacts, Public desktop update rehearsal, Synchronize public release metadata]
    types: [completed]
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:
    inputs:
      completed_run:
        description: Optional public-upgrade run to await before recording its result
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: public-release-status
  cancel-in-progress: false

jobs:
  retry-runner-capacity:
    if: >-
      github.repository == 'Perseusxrltd/mnemion' &&
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled') &&
      (github.event.workflow_run.name == 'Prepare signed release' || github.event.workflow_run.name == 'Public desktop update rehearsal')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Retry only an unstarted first attempt with explicit capacity evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MNEMION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python -m deploy.runner_capacity_retry --run "$MNEMION_RUN_ID" --apply

  reconcile:
    if: github.repository == 'Perseusxrltd/mnemion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      # Read trusted code from main, never a pull-request artifact or event text.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Await the public-upgrade handoff
        if: github.event_name == 'workflow_dispatch' && inputs.completed_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MNEMION_COMPLETED_RUN: ${{ inputs.completed_run }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, time
          run_id = os.environ['MNEMION_COMPLETED_RUN']
          if not re.fullmatch(r'[1-9][0-9]{0,19}', run_id):
              raise SystemExit('Invalid public-upgrade run identifier')
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
          for attempt in range(24):
              run = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
              if run.get('path', '').partition('@')[0] != '.github/workflows/public-updates.yml':
                  raise SystemExit('The handoff must identify a public-upgrade run')
              if run.get('status') == 'completed':
                  break
              if attempt == 23:
                  raise SystemExit('Public-upgrade run did not finish within the handoff window')
              time.sleep(5)
          PY
      - name: Reconcile publication, exact-source gates and scope
        if: github.event_name != 'issues' && github.event_name != 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m deploy.release_status
      - name: Record issue changes and failed build steps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m deploy.issue_releases --apply
          python -m deploy.maintenance_snapshot --write
      - name: Update the single public status record
        run: |
          git add -- deploy/release-status.json docs/RELEASE_STATUS.md docs/validation/releases deploy/maintenance-status.json docs/MAINTENANCE_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'docs: synchronize public release status'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' rebase origin/main
          done
          exit 1
