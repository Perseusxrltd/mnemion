name: Installed telemetry delivery

# Manual diagnostic only. This does not publish, sign a release, or accept the
# installed journey. One disposable localhost certificate is shared by a Windows
# x64 engine freeze and the selected packaging jobs. No target input runs all
# six. The private key is a one-day diagnostic artifact, never a release asset
# or a packaged file. Windows ARM
# imports that engine. build-resources.mjs still refuses to freeze an engine there.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated matrix OS names. Empty runs all six delivery targets.'
        required: false
        default: ''
        type: string
      resource_comparison:
        description: >-
          Attach the existing 128-cycle resource workload to installed packages.
          Accepted values are the boolean true and false. Omitted or false keeps
          the selected delivery. true prepares an inactive package and an
          active package from the same source and runs the resource comparison.
          This input does not select targets.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telemetry-installed-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      database_matrix: ${{ steps.select.outputs.database_matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: select
        env:
          MNEMION_TELEMETRY_TARGETS: ${{ inputs.targets }}
        run: python -m deploy.release_targets --targets "$MNEMION_TELEMETRY_TARGETS" >> "$GITHUB_OUTPUT"

  native_database:
    needs: targets
    uses: ./.github/workflows/native-runtime.yml
    with:
      matrix: ${{ needs.targets.outputs.database_matrix }}

  loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked --no-default-groups --group native-build --no-managed-python
      - name: Issue disposable localhost TLS material outside the source tree
        run: .venv/bin/python -m deploy.telemetry_installed_fixture --issue-loopback --output "${{ runner.temp }}/loopback"
      - name: Upload the public test certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-diagnostic-loopback-certificate
          path: ${{ runner.temp }}/loopback/certificate.pem
          if-no-files-found: error
          retention-days: 1
      - name: Upload the disposable test key outside every package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-diagnostic-loopback-key
          path: ${{ runner.temp }}/loopback/key.pem
          if-no-files-found: error
          retention-days: 1

  diagnostic_engine:
    needs: loopback
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.resource_comparison && 80 || 40 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: engine_python
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          architecture: x64
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            studio/frontend/package-lock.json
            studio/electron/package-lock.json
      - run: python -m pip install uv==0.12.24
      - name: Locked native service build dependencies
        run: uv sync --locked --no-default-groups --group native-build --python "${{ steps.engine_python.outputs.python-path }}" --no-managed-python
      - name: Download the disposable loopback certificate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: telemetry-diagnostic-loopback-certificate
          path: ${{ runner.temp }}/loopback
      - name: Stage a disposable baked engine source
        run: |
          & "${{ github.workspace }}\.venv\Scripts\python.exe" -c "from pathlib import Path; import os; from deploy.probe_telemetry_installed import copy_declared_source; from deploy.telemetry_installed_fixture import bake_checkout; copy = Path(os.environ['RUNNER_TEMP']) / 'engine-source'; copy.mkdir(); copy_declared_source(Path(os.environ['GITHUB_WORKSPACE']), copy); bake_checkout(copy, Path(os.environ['RUNNER_TEMP']) / 'loopback' / 'certificate.pem')"
      - name: Freeze the diagnostic x64 engine from that baked copy
        working-directory: ${{ runner.temp }}/engine-source
        run: |
          & "${{ github.workspace }}\.venv\Scripts\python.exe" -m deploy.build_native_engine --work "${{ runner.temp }}/engine-work" --output "${{ runner.temp }}/engine-output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-diagnostic-engine-windows-x64
          path: ${{ runner.temp }}/engine-output/mnemion-engine-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 1
      - name: Stage a same-source unbaked engine copy
        if: inputs.resource_comparison
        run: |
          & "${{ github.workspace }}\.venv\Scripts\python.exe" -c "from pathlib import Path; import os; from deploy.probe_telemetry_installed import copy_declared_source; copy = Path(os.environ['RUNNER_TEMP']) / 'engine-source-inactive'; copy.mkdir(); copy_declared_source(Path(os.environ['GITHUB_WORKSPACE']), copy)"
      - name: Freeze the same-source inactive x64 engine
        if: inputs.resource_comparison
        working-directory: ${{ runner.temp }}/engine-source-inactive
        run: |
          & "${{ github.workspace }}\.venv\Scripts\python.exe" -m deploy.build_native_engine --work "${{ runner.temp }}/engine-work-inactive" --output "${{ runner.temp }}/engine-output-inactive"
      - name: Upload the inactive diagnostic engine
        if: inputs.resource_comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-diagnostic-engine-windows-x64-inactive
          path: ${{ runner.temp }}/engine-output-inactive/mnemion-engine-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  delivery:
    needs: [targets, native_database, loopback, diagnostic_engine]
    if: needs.targets.result == 'success' && needs.native_database.result == 'success' && needs.loopback.result == 'success' && needs.diagnostic_engine.result == 'success'
    name: ${{ inputs.resource_comparison && 'Installed resource workload' || 'Installed fixture delivery' }} / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.resource_comparison && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MNEMION_REQUIRE_CODE_SIGNATURE: '0'
      MNEMION_ENGINE_PYTHON: ${{ github.workspace }}/.venv/${{ startsWith(matrix.os, 'windows-') && 'Scripts/python.exe' || 'bin/python' }}
      MNEMION_BUILD_PYTHON: ${{ github.workspace }}/studio/client/.venv/${{ startsWith(matrix.os, 'windows-') && 'Scripts/python.exe' || 'bin/python' }}
      MNEMION_POSTGRES_ARCHIVES: ${{ github.workspace }}/build-tmp/native-postgres
      MNEMION_ENGINE_ARCHIVES: ${{ matrix.platform == 'windows' && format('{0}/build-tmp/diagnostic-engine', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: client_python
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            studio/frontend/package-lock.json
            studio/electron/package-lock.json
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2 libnotify4 libfuse2 libsecret-1-0 gnome-keyring dbus-x11
      - run: python -m pip install uv==0.12.24
      - run: uv sync --project studio/client --locked --python "${{ steps.client_python.outputs.python-path }}" --no-managed-python
      - name: Select the service interpreter independently of the desktop client
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: engine_python
        with:
          python-version: '3.13'
          architecture: ${{ matrix.platform == 'windows' && 'x64' || matrix.arch }}
      - name: Locked native service build dependencies
        run: uv sync --locked --no-default-groups --group native-build --python "${{ steps.engine_python.outputs.python-path }}" --no-managed-python
      - name: Download this commit's verified database archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-postgres-${{ matrix.platform }}-${{ matrix.platform == 'windows' && 'x64' || matrix.arch }}
          path: build-tmp/native-postgres
      - name: Download the shared public test certificate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: telemetry-diagnostic-loopback-certificate
          path: ${{ runner.temp }}/loopback-certificate
      - name: Download the disposable test key
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: telemetry-diagnostic-loopback-key
          path: ${{ runner.temp }}/loopback-key
      - name: Assemble loopback material outside the evidence directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/loopback"
          cp "$RUNNER_TEMP/loopback-certificate/certificate.pem" "$RUNNER_TEMP/loopback/certificate.pem"
          cp "$RUNNER_TEMP/loopback-key/key.pem" "$RUNNER_TEMP/loopback/key.pem"
          chmod 600 "$RUNNER_TEMP/loopback/key.pem"
      - name: Download the same-source diagnostic Windows engine
        if: matrix.platform == 'windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: telemetry-diagnostic-engine-windows-x64
          path: build-tmp/diagnostic-engine
      - name: Download the same-source inactive Windows engine
        if: inputs.resource_comparison && matrix.platform == 'windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: telemetry-diagnostic-engine-windows-x64-inactive
          path: build-tmp/diagnostic-engine-inactive
      - name: Exercise one unpublished installed fixture delivery
        if: ${{ !inputs.resource_comparison }}
        run: ${{ github.workspace }}/.venv/${{ startsWith(matrix.os, 'windows-') && 'Scripts/python.exe' || 'bin/python' }} -m deploy.probe_telemetry_installed --source "${{ github.workspace }}" --output "${{ github.workspace }}/output/telemetry-installed-delivery" --loopback-material "${{ runner.temp }}/loopback"
      - name: Exercise the optional installed resource comparison
        if: ${{ inputs.resource_comparison }}
        env:
          MNEMION_OWNED_LAUNCH_PYTHON: ${{ steps.client_python.outputs.python-path }}
          MNEMION_ENGINE_ARCHIVES_INACTIVE: ${{ matrix.platform == 'windows' && format('{0}/build-tmp/diagnostic-engine-inactive', github.workspace) || '' }}
        run: ${{ github.workspace }}/.venv/${{ startsWith(matrix.os, 'windows-') && 'Scripts/python.exe' || 'bin/python' }} -m deploy.probe_telemetry_installed --source "${{ github.workspace }}" --output "${{ github.workspace }}/output/telemetry-installed-resources" --loopback-material "${{ runner.temp }}/loopback" --resource-comparison
      - name: Keep the installed fixture delivery evidence
        if: always() && !inputs.resource_comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-installed-delivery-${{ matrix.platform }}-${{ matrix.arch }}
          path: output/telemetry-installed-delivery/
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the installed resource evidence
        if: always() && inputs.resource_comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-installed-resources-${{ matrix.platform }}-${{ matrix.arch }}
          path: output/telemetry-installed-resources/
          if-no-files-found: ignore
          retention-days: 7
