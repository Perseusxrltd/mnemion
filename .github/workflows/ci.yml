name: Product checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: mnemion_ci_only
          POSTGRES_DB: mnemion_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mnemion_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MNEMION_TEST_ADMIN_DSN: postgresql://postgres:mnemion_ci_only@localhost:5432/mnemion_ci
      MNEMION_REQUIRE_NODE_SDK: '1'
      MNEMION_TEST_LOCAL_MODEL: ${{ matrix.python == '3.12' && '1' || '0' }}
      MNEMION_MODEL_CACHE: ${{ github.workspace }}/.tmp/ci-model-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/client/package-lock.json
      - run: python -m pip install uv==0.12.24
      - name: Matching PostgreSQL recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "MNEMION_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - run: uv sync --locked --python ${{ matrix.python }} --group dev
      - run: npm --prefix packages/client ci && npm --prefix packages/client test
      - run: uv run --no-sync python -m pytest service_tests -q --cov=mnemion.service --cov-report=term-missing --cov-fail-under=75
      - run: uv run --no-sync mnemion-service schema --output /tmp/openapi.json && diff docs/service/openapi.json /tmp/openapi.json
      - run: uv run --no-sync mnemion-service agent-schema --output /tmp/agent-contract.json && diff mnemion/service/agent_contract.json /tmp/agent-contract.json

  container:
    name: container (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the actual deployment image with its documentation
        run: docker build --file deploy/Dockerfile --tag mnemion:check .
      - name: Verify the non-root image includes Studio, guides and notices offline
        run: |
          docker run --rm -i --network none --read-only --tmpfs /tmp \
            --memory 1g --memory-swap 1g --cpus 2 \
            --env MNEMION_STUDIO_DIST=/opt/mnemion/studio \
            --entrypoint python mnemion:check - <<'PY'
          import json, os
          from pathlib import Path
          from mnemion.service.studio import resolve_studio
          from mnemion.service.deployment import main
          from mnemion.version import __version__
          path, source = resolve_studio()
          assert os.geteuid() != 0 and source == "explicit"
          assert (path / "index.html").is_file()
          assets = [item.read_text() for item in (path / "assets").glob("*.js")]
          assert any("Mnemion product roadmap" in body for body in assets)
          assert any("# Mnemion " + __version__ in body for body in assets)
          assert any("mnemion-service studio build" in body for body in assets)
          assert Path("/opt/mnemion/licenses/frontend/inventory.json").is_file()
          assert Path("/opt/mnemion/licenses/python/inventory.json").is_file()
          print(json.dumps({"version": __version__, "studio": True, "offline_guides": True,
                            "license_inventories": True, "non_root": True}))
          PY

  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked --extra legacy --group dev
      - run: uv run --no-sync python -m pytest tests -q --cov=mnemion --cov-report=term-missing --cov-fail-under=30

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: python deploy/release.py
      - run: git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked --no-dev
      - run: uvx pip-audit --path .venv/lib/python3.12/site-packages

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            studio/frontend/package-lock.json
            studio/electron/package-lock.json
      - run: python -m pip install uv==0.12.24
      - run: python deploy/bundle_studio.py
      - run: npm --prefix packages/client test
      - name: Verify wheel and source package include the matching web Studio
        run: |
          uv build --out-dir build-tmp/source-check
          python deploy/bundle_studio.py --verify-artifacts build-tmp/source-check
      - run: npm --prefix studio/frontend audit --audit-level=high
      - run: npm --prefix studio/electron ci && npm --prefix studio/electron test
      - run: npm --prefix studio/electron audit --audit-level=high
