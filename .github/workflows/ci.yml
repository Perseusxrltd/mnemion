name: Product checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

# Superseded branch checks must not crowd the immutable release's native jobs.
# Reusable release checks retain their own group and are never cancelled here.
concurrency:
  group: product-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release || false }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - id: scope
        env:
          MNEMION_CI_RELEASE: ${{ inputs.release || false }}
        run: python -m deploy.ci_scope >> "$GITHUB_OUTPUT"

  service:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: mnemion_ci_only
          POSTGRES_DB: mnemion_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mnemion_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MNEMION_TEST_ADMIN_DSN: postgresql://postgres:mnemion_ci_only@localhost:5432/mnemion_ci
      MNEMION_REQUIRE_NODE_SDK: '1'
      MNEMION_REQUIRE_SSH_TESTS: '1'
      MNEMION_TEST_LOCAL_MODEL: ${{ matrix.python == '3.12' && '1' || '0' }}
      MNEMION_TEST_MANAGED_INSTALL: ${{ matrix.python == '3.12' && '1' || '0' }}
      MNEMION_MODEL_CACHE: ${{ github.workspace }}/.tmp/ci-model-cache
      MNEMION_TEST_MODEL_REPORT_DIR: ${{ github.workspace }}/.tmp/ci-model-idle
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/client/package-lock.json
      - run: python -m pip install uv==0.12.24
      - name: Matching PostgreSQL recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 openssh-server
          echo "MNEMION_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - run: uv sync --locked --python ${{ matrix.python }} --group dev
      - name: Check release versions before building clients and running the service matrix
        run: uv run --no-sync python deploy/release.py
      - run: npm --prefix packages/client ci && npm --prefix packages/client test
      - run: uv run --no-sync python -m pytest service_tests -q --cov=mnemion --cov-config=deploy/service.coveragerc --cov-report=term-missing --cov-fail-under=75
      - name: Preserve measured real-model idle cleanup and reload results
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-idle-linux-x64
          path: ${{ github.workspace }}/.tmp/ci-model-idle/*.json
          if-no-files-found: warn
          retention-days: 14
      - run: uv run --no-sync mnemion-service schema --output /tmp/openapi.json && diff docs/service/openapi.json /tmp/openapi.json
      - run: uv run --no-sync mnemion-service agent-schema --output /tmp/agent-contract.json && diff mnemion/service/agent_contract.json /tmp/agent-contract.json

  supervision-macos:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: supervision (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.24
      - name: Build the current Intel cryptography runtime with static OpenSSL
        if: matrix.runner == 'macos-15-intel'
        run: python -m deploy.build_intel_crypto --output "$RUNNER_TEMP/mnemion-runtime-wheels"
      - name: Install the native service without building on a managed host
        run: |
          if [ "${{ matrix.runner }}" = "macos-15-intel" ]; then
            uv sync --locked --python 3.12 --group dev --no-install-package cryptography
            uv pip install --python .venv/bin/python --no-deps --no-index "$RUNNER_TEMP"/mnemion-runtime-wheels/*.whl
          else
            uv sync --locked --python 3.12 --group dev
          fi
      - name: Verify managed installation, host recovery, signed updates and rollback with real processes
        env:
          MNEMION_TEST_MANAGED_INSTALL: '1'
          MNEMION_TEST_RUNTIME_WHEELS: ${{ runner.temp }}/mnemion-runtime-wheels
          MNEMION_TEST_PROCESS_DIAGNOSTICS: '1'
        run: uv run --no-sync python -m pytest service_tests/test_model_broker.py service_tests/test_supervision.py service_tests/test_supervised_capture.py service_tests/test_managed_service.py service_tests/test_managed_connectors.py service_tests/test_passwords.py service_tests/test_host_recovery.py service_tests/test_application_key_recovery.py service_tests/test_keepass_portability.py -q
      - name: Verify both pinned local models on the actual Mac runtime
        env:
          MNEMION_TEST_LOCAL_MODEL: '1'
          MNEMION_MODEL_CACHE: ${{ runner.temp }}/mnemion-model-cache
          MNEMION_TEST_MODEL_REPORT_DIR: ${{ runner.temp }}/mnemion-model-idle
        run: uv run --no-sync python -m pytest service_tests/test_local_model.py -q
      - name: Preserve measured Mac model cleanup and reload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-idle-${{ matrix.runner }}
          path: ${{ runner.temp }}/mnemion-model-idle/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Audit the installed Mac dependencies
        run: uvx pip-audit --path .venv/lib/python3.12/site-packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # A complete same-source main run may supply this tested wheel to a release.
        if: matrix.runner == 'macos-15-intel'
        with:
          name: release-service-macos-x64
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/mnemion-runtime-wheels/*.whl

  container:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: container (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the actual deployment image with its documentation
        run: docker build --file deploy/Dockerfile --tag mnemion:check .
      - name: Verify the non-root image includes Studio, guides and notices offline
        run: |
          docker run --rm -i --network none --read-only --tmpfs /tmp \
            --memory 1g --memory-swap 1g --cpus 2 \
            --env MNEMION_STUDIO_DIST=/opt/mnemion/studio \
            --entrypoint python mnemion:check - <<'PY'
          import json, os
          from pathlib import Path
          from mnemion.service.studio import resolve_studio
          from mnemion.service.deployment import main
          from mnemion.version import __version__
          path, source = resolve_studio()
          assert os.geteuid() != 0 and source == "explicit"
          assert (path / "index.html").is_file()
          assets = [item.read_text() for item in (path / "assets").glob("*.js")]
          assert any("Mnemion product roadmap" in body for body in assets)
          assert any("# Mnemion " + __version__ in body for body in assets)
          assert any("mnemion-service studio build" in body for body in assets)
          assert Path("/opt/mnemion/licenses/frontend/inventory.json").is_file()
          assert Path("/opt/mnemion/licenses/python/inventory.json").is_file()
          print(json.dumps({"version": __version__, "studio": True, "offline_guides": True,
                            "license_inventories": True, "non_root": True}))
          PY

  legacy:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked --extra legacy --group dev
      - run: uv run --no-sync python -m pytest tests -q --cov=mnemion --cov-config=deploy/legacy.coveragerc --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Scan exact source with pinned rules and an archived-key rejection control
        run: python -m deploy.secret_scan --source --output output/source-secret-scan.json
      - name: Retain source scan receipt without matched content
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-secret-scan
          path: output/source-secret-scan.json
          if-no-files-found: error
          retention-days: 7
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: python deploy/release.py
      - run: git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n

  dependency-audit:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked --no-dev --extra supervision
      - run: uvx pip-audit --path .venv/lib/python3.12/site-packages

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            studio/frontend/package-lock.json
            studio/electron/package-lock.json
      - run: python -m pip install uv==0.12.24
      - name: Check the lightweight native client before six-platform packaging
        run: |
          uv sync --project studio/client --locked --python 3.13 --no-managed-python
          uv run --project studio/client --no-sync python -m pytest client_tests -q
      - run: python deploy/bundle_studio.py
      - run: npm --prefix packages/client test
      - run: npm --prefix studio/frontend run test:map
      - run: npm --prefix studio/frontend run test:telemetry
      - name: Verify wheel and source package include the matching web Studio
        run: |
          uv build --out-dir build-tmp/source-check
          python deploy/bundle_studio.py --verify-artifacts build-tmp/source-check
      - run: npm --prefix studio/frontend audit --audit-level=high
      - run: uv sync --locked --extra supervision
      - run: npm --prefix studio/electron ci
      # TLS fixtures use the same locked cryptography and Python as the service.
      - run: uv run --no-sync npm --prefix studio/electron test
      - name: Independent host control through the real desktop profile and native engine
        env:
          MNEMION_REQUIRE_HOST_CLIENT_TESTS: '1'
        run: |
          uv run --no-sync python -m pytest service_tests/test_host_control_desktop.py -q
      - run: npm --prefix studio/electron audit --audit-level=high
